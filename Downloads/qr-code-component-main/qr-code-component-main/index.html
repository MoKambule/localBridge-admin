
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | QR code component</title>

  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      min-height: 100vh;
      padding: 20px;
      margin: 0;
      background-color: hsl(212, 45%, 89%);
      font-family: Arial, sans-serif;
    }

    .card {
      box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
      transition: 0.3s;
      width: 215px;
      padding: 14px;
      border-radius: 12px;
      background-color: white;
      text-align: center;
    }

    .card:hover {
      box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
    }

    .card img {
      width: 100%;
      border-radius: 8px;
    }

    .container {
      padding: 1px 4px;
    }

    .container h4 {
      margin-bottom: 8px;
    }

    .container p {
      font-size: 14px;
      color: gray;
      line-height: 1.5;
    }

    .attribution {
      margin-top: 20px;
      font-size: 11px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="card">
    <img src="images/image-qr-code.png" alt="QR code">

    <div class="container">
      <h5><b>Improve your front end skills by building projects</b></h5>

      <p>Scan the QR code to visit your Mentor and take your coding skills to the next level.</p>
    </div>
  </div>

  <footer class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Mokgethwa Kambule </a>.
  </footer>

</body>
</html>
